services:
  - type: web
    name: unipods-memory-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_PGVECTOR
        value: "false"
      # Programme dates are Africa/CAT (UTC+2). Oregon hosts are UTC.
      - key: TZ
        value: Africa/Maputo
